name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR cuts a
# *draft* GitHub Release for vX.Y.Z; `artifacts` then attaches the binaries, an
# SBOM and a signed provenance attestation, and publishes the draft last.
#
# Why this is two release-please jobs and not one — do not collapse them back:
# a draft release has no git tag, publishing it is what creates the tag. A
# single invocation cuts the release and then computes the next release PR in
# the same run, while the release is still a draft — so there is no tag for the
# version already in .release-please-manifest.json, release-please loses its
# anchor, walks the entire history and opens a PR re-releasing everything.
# Merging that cuts another release, which opens another PR, forever. So:
#
#   release-please  phase 1 — cut the draft release only
#   artifacts       attach assets, publish the draft -> tag exists
#   release-pr      phase 2 — open/update the next release PR only

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # "simple" is language-agnostic (tracks version.txt + CHANGELOG).
          # Swap for node/python/rust/etc. to also bump manifests.
          # Manifest mode: release-please-config.json sets `draft: true` so the
          # GitHub Release is created unpublished. Immutable releases reject asset
          # uploads once a release is published, so assets must land while it is
          # still a draft; a later step flips it to published.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  artifacts:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless signing via Sigstore
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release is still a draft here, so its tag ref does not exist
          # yet. This push *is* the release commit, so check that out instead.
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Pure Go, so cross-compiling is a loop rather than a build matrix.
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath \
              -o "dist/aws-killswitch-$os-$arch" ./cmd/aws-killswitch
          done
          cd dist && sha256sum -- * > checksums.txt

      - name: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json

      # Keyless Sigstore signing — no long-lived key to store or rotate. Verify
      # with: gh attestation verify <binary> --repo <owner>/<repo>
      - name: sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/aws-killswitch-*

      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY"

      - name: Publish the draft release
        # Assets can only be attached while the release is a draft;
        # publishing last is what leaves it immutable with assets intact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag }}" --draft=false --repo "$GITHUB_REPOSITORY"

  # Phase 2 — open/update the next release PR, now that `artifacts` has
  # published the draft and the tag exists. `always()` because on an ordinary
  # push no release was cut and `artifacts` is skipped, yet the release PR still
  # has to be kept up to date; when a release *was* cut, `artifacts` must have
  # succeeded, or there is no tag to anchor on and this would re-release the
  # whole history.
  release-pr:
    needs: [release-please, artifacts]
    if: always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.released != 'true'
      || needs.artifacts.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the release PR
    steps:
      # Same configuration as phase 1 — the two invocations must agree.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
